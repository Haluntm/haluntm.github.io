<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dream Journal: A personal app to record, interpret, and manage your dreams. Built by Mohammad Jalal Jaleh." />
    <meta name="author" content="Mohammad Jalal Jaleh" />
    <title>Dream Journal</title>
    <link rel="icon" href="eye.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <main id="app">

        <!-- LOGIN -->
        <section id="login-view" class="view active">
            <img style="width: 100px; margin: 0 auto; display: block;" src="eye.ico" alt="Dream Journal Icon" />
            <h1 style="text-align: center;">Dream Journal</h1>
            <input id="usernameInput" placeholder="Username" required>
            <input id="passwordInput" type="password" placeholder="Password" required>
            <button id="loginBtn">Login</button>

            <h3 style="text-align: center;">اگر رمز عبور ندارید از طریق ربات آن را دریافت کنید.</h3>

        </section>

        <!-- DREAMS -->
        <section id="dreams-view" class="view">
            <header class="topbar">
                <span id="userName"></span>
                <div>
                    <button id="newDreamBtn">➕ New</button>
                    <button id="refreshBtn">💫 Refresh</button>
                </div>
            </header>

            <input id="searchInput" placeholder="Search dreams…" />

            <div class="actions">
                <button id="copyAllBtn">📄 Copy All</button>
                <button id="goToEndBtn">⚓ Go to End</button>
            </div>

            <div id="dreamList"></div>
        </section>

        <!-- EDITOR -->
        <section id="editor-view" class="view">
            <h2 id="editorTitle">New Dream</h2>

            <input id="edTitle" placeholder="Title / عنوان">
            <textarea id="edBody" placeholder="Body / شرح خواب"></textarea>
            <textarea id="edInterpretation" placeholder="Interpretation / تعبیر"></textarea>
            <textarea id="edForeshadowing" placeholder="Foreshadowing / پیشگویی"></textarea>
            <textarea id="edCause" placeholder="Cause / علت"></textarea>
            <input id="edPeople" placeholder="People names / اسامی نفرات">

            <input id="edDateEvent" placeholder="Date event / تاریخ روئیت">
            <input id="edDateHour" placeholder="Date hour / ساعت روئیت">

            <input id="edLocation" placeholder="Location / مکان">
            <input id="edPurpose" placeholder="Purpose / هدف">
            <textarea id="edOpinion" placeholder="Opinion / دیدگاه"></textarea>

            <label><input type="checkbox" id="edOccurred"> Occurred / رخ داد</label>
            <input id="edDateOccurred" placeholder="Date Occurred / تاریخ رخ‌داد">
            <textarea id="edNarration" placeholder="Narration / رخ‌داد پیش بینی شده"></textarea>

            <div class="checks">
                <label><input type="checkbox" id="edPublic"> Public</label>
                <label><input type="checkbox" id="edLocked"> Locked</label>
                <label><input type="checkbox" id="edImagination"> Imagination</label>
                <label><input type="checkbox" id="edSpoiler"> Spoiler</label>
            </div>

            <label>Lucidity / شفافیت</label>
            <input type="range" id="edLucidity" min="0" max="10" value="0">

            <label>Importance / اهمیت</label>
            <input type="range" id="edImportance" min="0" max="10" value="0">

            <div class="editor-actions">
                <button id="cancelEditBtn">Cancel</button>
                <button id="saveEditBtn">Save</button>
            </div>
        </section>

    </main>

    <footer style="text-align: center; padding: 10px; font-size: 12px; color: #bfc0c3;">
        Built by Mohammad Jalal Jaleh
    </footer>

    <script src="app.js"></script>
</body>
</html>
