<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dreams</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <main id="app">

        <!-- LOGIN -->
        <section id="login-view" class="view active">
            <h1>Dreams</h1>
            <input id="usernameInput" placeholder="Username">
            <input id="passwordInput" type="password" placeholder="Password">
            <button id="loginBtn">Login</button>
        </section>

        <!-- DREAMS -->
        <section id="dreams-view" class="view">
            <header class="topbar">
                <span id="userName"></span>
                <div>
                    <button id="newDreamBtn">➕ New</button>
                    <button id="refreshBtn">💫 Refresh</button>
                </div>
            </header>

            <input id="searchInput" placeholder="Search dreams…" />

            <div class="actions">
                <button id="copyAllBtn">📄 Copy All</button>
                <button id="goToEndBtn">⚓ Go to End</button>
            </div>

            <div id="dreamList"></div>
        </section>

        <!-- EDITOR -->
        <section id="editor-view" class="view">
            <h2 id="editorTitle">New Dream</h2>

            <input id="edTitle" placeholder="Title">
            <textarea id="edBody" placeholder="Body"></textarea>
            <textarea id="edInterpretation" placeholder="Interpretation"></textarea>
            <textarea id="edForeshadowing" placeholder="Foreshadowing"></textarea>
            <textarea id="edCause" placeholder="Cause"></textarea>
            <input id="edPeople" placeholder="People names">

            <input id="edDateEvent" placeholder="Date event">
            <input id="edDateHour" placeholder="Date hour">

            <input id="edLocation" placeholder="Location">
            <input id="edPurpose" placeholder="Purpose">
            <textarea id="edOpinion" placeholder="Opinion"></textarea>

            <div class="checks">
                <label><input type="checkbox" id="edPublic"> Public</label>
                <label><input type="checkbox" id="edLocked"> Locked</label>
                <label><input type="checkbox" id="edImagination"> Imagination</label>
                <label><input type="checkbox" id="edSpoiler"> Spoiler</label>
            </div>

            <label>Lucidity</label>
            <input type="range" id="edLucidity" min="0" max="10">

            <label>Importance</label>
            <input type="range" id="edImportance" min="0" max="10">

            <div class="editor-actions">
                <button id="cancelEditBtn">Cancel</button>
                <button id="saveEditBtn">Save</button>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
